services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (FastAPI)
  # -------------------------------------------------------------
  - type: web
    name: arm-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: arm-postgres
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: "http://localhost:3000,https://arm-frontend.onrender.com"
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: THE_GRAPH_API_KEY
        sync: false
      - key: ONEINCH_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: ENABLE_THE_GRAPH
        value: "true"
      - key: ENABLE_RPC_DISCOVERY
        value: "true"
      - key: ENABLE_BLOCKSCOUT_DISCOVERY
        value: "true"

  # -------------------------------------------------------------
  # 2. Frontend Web Service (Next.js 14 App Router)
  # -------------------------------------------------------------
  - type: web
    name: arm-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set to https://arm-backend.onrender.com
      - key: NEXT_PUBLIC_PRIVY_APP_ID
        sync: false

# -------------------------------------------------------------
# 3. Managed PostgreSQL Database
# -------------------------------------------------------------
databases:
  - name: arm-postgres
    databaseName: risk_manager
    user: postgres
    region: oregon
    plan: free
