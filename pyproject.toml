[project]
name = "agentic-risk-manager"
version = "0.1.0"
description = "Agentic Crypto Risk Manager Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "numpy>=1.26.4",
    "scipy>=1.12.0",
    "pandas>=2.2.1",
    "httpx>=0.27.0",
    "redis>=5.0.3",
    "python-multipart>=0.0.9",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=4.1.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
